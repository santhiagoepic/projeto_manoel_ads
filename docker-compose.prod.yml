services:
  # API (backend)
  api-advogado:
    build:
      context: .
      target: api-prod
    image: advmanoelneto-api:latest
    environment:
      API_PORT: "8787"
      DB_PATH: "/data/database.sqlite"
      NODE_ENV: "production"
      SERVE_WEB: "0"
      # Não esqueça de configurar as variáveis abaixo no Portainer ou em um arquivo .env
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Opcional: liberar CORS para o host público (se o browser precisar falar direto com a API)
      CORS_ORIGIN: "https://advmanoelneto.com.br"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/data
    networks:
      - crononest
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=crononest"
        # API: /api e /uploads
        - "traefik.http.routers.adv-manoel-api.rule=Host(`advmanoelneto.com.br`) && (PathPrefix(`/api`) || PathPrefix(`/uploads`))"
        - "traefik.http.routers.adv-manoel-api.entrypoints=websecure"
        - "traefik.http.routers.adv-manoel-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.adv-manoel-api.priority=20"
        - "traefik.http.services.adv-manoel-api.loadbalancer.server.port=8787"
        - "traefik.http.routers.adv-manoel-api.service=adv-manoel-api"

  # WEB (frontend estático)
  web-advogado:
    build:
      context: .
      target: web-prod
    image: advmanoelneto-web:latest
    environment:
      WEB_PORT: "3000"
    networks:
      - crononest
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=crononest"
        # Site: tudo exceto /api e /uploads
        - "traefik.http.routers.adv-manoel-web.rule=Host(`advmanoelneto.com.br`)"
        - "traefik.http.routers.adv-manoel-web.entrypoints=websecure"
        - "traefik.http.routers.adv-manoel-web.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.adv-manoel-web.priority=10"
        - "traefik.http.services.adv-manoel-web.loadbalancer.server.port=3000"
        - "traefik.http.routers.adv-manoel-web.service=adv-manoel-web"

networks:
  crononest:
    external: true
    name: crononest
